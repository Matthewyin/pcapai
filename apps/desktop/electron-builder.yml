appId: com.pcapai.app
productName: pcapAI
copyright: Copyright © 2026 pcapAI
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  # 整个项目根作为 Resources/app；运行时 process.resourcesPath/app 指向这里
  - from: ../../
    to: app
    filter:
      - apps/api/dist/**/*
      - apps/web/dist/**/*
      - mcp/tshark-query/dist/**/*
      - mcp/evidence-opener/dist/**/*
      - packages/shared/dist/**/*
      - config/defaults.json
      - apps/api/package.json
      - mcp/tshark-query/package.json
      - mcp/evidence-opener/package.json
      - apps/web/package.json
      - packages/shared/package.json
      - package.json
      # 阶段 3a 双层库：只内置精简库（20MB），完整库（786MB）通过 GitHub Release 静默下载
      # 不打包 RFC/ 语料（786MB 文本）和完整 rfc.db（786MB）—— 节省 ~1.5GB
      - data/rfc-index/rfc-mini.db
      # 实战笔记 + 技能 seeds（首次启动时 copy 到 userData 可写区）
      - data/field-notes/seeds/**/*
      - data/skills/**/*
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 pcapAI
    LSEnvironment:
      PCAPAI_DESKTOP_MODE: prod
    CFBundleDocumentTypes:
      - CFBundleTypeName: Packet Capture
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        LSItemContentTypes:
          - com.wireshark.pcap
          - com.wireshark.pcapng
        CFBundleTypeExtensions:
          - pcap
          - pcapng
          - cap
dmg:
  title: pcapAI ${version}
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
