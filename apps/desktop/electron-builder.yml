appId: com.pcapai.app
productName: pcapAI
copyright: Copyright © 2026 pcapAI
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  # 整个项目根作为 Resources/app；运行时 process.resourcesPath/app 指向这里
  - from: ../../
    to: app
    filter:
      - apps/api/dist/**/*
      - apps/web/dist/**/*
      - mcp/tshark-query/dist/**/*
      - mcp/evidence-opener/dist/**/*
      - packages/shared/dist/**/*
      - config/defaults.json
      - apps/api/package.json
      - mcp/tshark-query/package.json
      - mcp/evidence-opener/package.json
      - apps/web/package.json
      - packages/shared/package.json
      - package.json
      # 运行时依赖：API（express/cors/better-sqlite3/dotenv）+ MCP（@modelcontextprotocol/sdk）
      # + OpenAI Agents SDK + zod 等。native 模块（better-sqlite3）已 rebuild 为 Electron ABI。
      # 排除 devDependencies（electron/electron-builder/typescript/vite/babel 等构建工具，运行时不需要）
      # web 前端依赖（lucide-react/react-dom/react）也不需要（dist 已 build）
      - node_modules/**/*
      - "!node_modules/electron/**"
      - "!node_modules/electron-builder/**"
      - "!node_modules/app-builder-bin/**"
      - "!node_modules/electron-winstaller/**"
      - "!node_modules/7zip-bin/**"
      - "!node_modules/typescript/**"
      - "!node_modules/@esbuild/**"
      - "!node_modules/lightningcss-darwin-arm64/**"
      - "!node_modules/@babel/**"
      - "!node_modules/vite/**"
      - "!node_modules/postject/**"
      - "!node_modules/@electron/**"
      - "!node_modules/@tailwindcss/**"
      # 前端依赖（dist 已 build，运行时不需要源码）
      - "!node_modules/lucide-react/**"
      - "!node_modules/react-dom/**"
      - "!node_modules/react/**"
      - "!node_modules/scheduler/**"
      # 其他构建/类型工具
      - "!node_modules/rxjs/**"
      - "!node_modules/lodash/**"
      - "!node_modules/rollup/**"
      - "!node_modules/@rollup/**"
      - "!node_modules/caniuse-lite/**"
      - "!node_modules/node-gyp/**"
      - "!node_modules/app-builder-lib/**"
      - "!node_modules/@develar/**"
      - "!node_modules/dmg-license/**"
      - "!node_modules/plist/**"
      - "!node_modules/@types/**"
      - "!node_modules/jiti/**"
      - "!node_modules/config-file-ts/**"
      - "!node_modules/csstype/**"
      # 阶段 3a 双层库：只内置精简库（20MB），完整库（786MB）通过 GitHub Release 静默下载
      # 不打包 RFC/ 语料（786MB 文本）和完整 rfc.db（786MB）—— 节省 ~1.5GB
      - data/rfc-index/rfc-mini.db
      # 实战笔记 + 技能 seeds（首次启动时 copy 到 userData 可写区）
      - data/field-notes/seeds/**/*
      - data/skills/**/*
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 pcapAI
    LSEnvironment:
      PCAPAI_DESKTOP_MODE: prod
    CFBundleDocumentTypes:
      - CFBundleTypeName: Packet Capture
        CFBundleTypeRole: Viewer
        LSHandlerRank: Default
        LSItemContentTypes:
          - com.wireshark.pcap
          - com.wireshark.pcapng
        CFBundleTypeExtensions:
          - pcap
          - pcapng
          - cap
dmg:
  title: pcapAI ${version}
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
